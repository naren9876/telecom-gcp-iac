name: Terraform STAGING Apply
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.16.5
      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.12/terragrunt_linux_amd64 -O /tmp/terragrunt
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/
          terragrunt --version
      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v1
      - name: Create Terraform Wrapper
        run: |
          mkdir -p /tmp/tf-wrapper
          cat > /tmp/tf-wrapper/terraform << 'WRAPPER'
          #!/bin/bash
          /home/runner/work/_temp/*/terraform-bin "$@" 2>&1 | grep -v "^ prefix="
          WRAPPER
          chmod +x /tmp/tf-wrapper/terraform
          echo "/tmp/tf-wrapper" >> $GITHUB_PATH
      - name: Terragrunt Apply STAGING
        working-directory: terraform/projects/staging
        run: terragrunt run-all apply --terragrunt-non-interactive -auto-approve
        env:
          TF_VAR_project_id: telecom-staging-456
          TF_VAR_environment: staging
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
          TF_DISABLE_REMOTE_TERRAFORM_VERSION_CHECK: "true"
      - if: always()
        run: |
          echo "### Terraform STAGING Apply" >> $GITHUB_STEP_SUMMARY
          echo "✅ Apply completed" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Applied to STAGING Environment**" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
