name: Terraform STAGING Apply
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5
      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.12/terragrunt_linux_amd64 -O /tmp/terragrunt
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/
          terragrunt --version
      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v1
      - name: Terragrunt Apply STAGING
        working-directory: terraform/projects/staging
        run: terragrunt run-all apply --terragrunt-non-interactive -auto-approve
        env:
          TF_VAR_project_id: telecom-staging-456
          TF_VAR_environment: staging
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
      - if: always()
        run: |
          echo "### Terraform STAGING Apply" >> $GITHUB_STEP_SUMMARY
          echo "✅ Apply completed" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Applied to STAGING Environment**" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
