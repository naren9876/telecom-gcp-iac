name: Terraform STAGING Plan
on:
  push:
    branches:
      - staging
    paths:
      - terraform/**
      - .github/workflows/terraform-staging-*.yml
jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.16.5
      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.12/terragrunt_linux_amd64 -O /tmp/terragrunt
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/
          terragrunt --version
      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_STAGING }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_STAGING }}
      - uses: google-github-actions/setup-gcloud@v1
      - name: Terragrunt Plan STAGING
        working-directory: terraform/projects/staging
        run: |
          terragrunt run-all plan --terragrunt-non-interactive 2>&1 | tee plan-output.txt
        env:
          TF_VAR_project_id: telecom-staging-456
          TF_VAR_environment: staging
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
          TF_DISABLE_REMOTE_TERRAFORM_VERSION_CHECK: "true"
      - if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-output.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '```\n' + plan.substring(0, 65000) + '\n```'
            })
      - if: always()
        run: |
          echo "### Terraform STAGING Plan" >> $GITHUB_STEP_SUMMARY
          echo "✅ Plan generated successfully" >> $GITHUB_STEP_SUMMARY
          echo "**Next Step:** Review the plan above, then manually trigger the apply workflow" >> $GITHUB_STEP_SUMMARY
          echo "📋 [Run STAGING Apply](https://github.com/${{ github.repository }}/actions/workflows/terraform-staging-apply.yml)" >> $GITHUB_STEP_SUMMARY
