name: Terraform DEV Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform-dev-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5
      
      - name: Install Terragrunt via Go
        run: |
          go install github.com/gruntwork-io/terragrunt@v0.55.12
          terragrunt --version
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
      
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
      
      - name: Terragrunt Plan DEV
        working-directory: terraform/projects/dev
        run: terragrunt run-all plan --terragrunt-non-interactive
        env:
          TF_VAR_project_id: "telecom-dev-123"
          TF_VAR_environment: "dev"
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
      
      - name: Terragrunt Apply DEV
        working-directory: terraform/projects/dev
        run: terragrunt run-all apply --terragrunt-non-interactive -auto-approve
        env:
          TF_VAR_project_id: "telecom-dev-123"
          TF_VAR_environment: "dev"
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
      
      - name: Notify Slack Success
        if: success()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "✅ Terraform DEV deployment succeeded",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform DEV Deployment*\nStatus: ✅ Success\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
      
      - name: Notify Slack Failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          payload: |
            {
              "text": "❌ Terraform DEV deployment failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform DEV Deployment*\nStatus: ❌ Failed\nCommit: ${{ github.sha }}\nAuthor: ${{ github.actor }}"
                  }
                }
              ]
            }
