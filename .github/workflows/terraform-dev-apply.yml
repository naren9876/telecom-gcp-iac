name: Terraform DEV Apply
on:
  workflow_dispatch:
jobs:
  apply:
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v3
      - uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.5
      - name: Install Terragrunt
        run: |
          wget https://github.com/gruntwork-io/terragrunt/releases/download/v0.55.12/terragrunt_linux_amd64 -O /tmp/terragrunt
          chmod +x /tmp/terragrunt
          sudo mv /tmp/terragrunt /usr/local/bin/
          terragrunt --version
      - name: Suppress Terraform warnings
        run: |
          mkdir -p /home/runner/work/_temp/terraform-wrapper
          cat > /home/runner/work/_temp/terraform-wrapper/terraform << 'WRAPPER'
          #!/bin/bash
          /home/runner/work/_temp/fd146625-1fed-4871-9884-44c23728177d/terraform-bin "$@" 2>/dev/null
          WRAPPER
          chmod +x /home/runner/work/_temp/terraform-wrapper/terraform
          export PATH="/home/runner/work/_temp/terraform-wrapper:$PATH"
      - uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_DEV }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_DEV }}
      - uses: google-github-actions/setup-gcloud@v1
      - name: Terragrunt Apply DEV
        working-directory: terraform/projects/dev
        run: terragrunt run-all apply --terragrunt-non-interactive -auto-approve 2>&1 | grep -v "Your version of Terraform"
        env:
          TF_VAR_project_id: telecom-dev-123
          TF_VAR_environment: dev
          TF_INPUT: "false"
          TF_IN_AUTOMATION: "true"
      - if: always()
        run: |
          echo "### Terraform DEV Apply" >> $GITHUB_STEP_SUMMARY
          echo "✅ Apply completed" >> $GITHUB_STEP_SUMMARY
          echo "**Changes Applied to DEV Environment**" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "Author: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
